version: '3.9'

services:
  docking:
    build:
      context: .
      dockerfile: .docker/octane.Dockerfile
    volumes:
      - app_storage:/var/www/html/storage/app
    networks:
      - docking-network
    depends_on:
      - gotenberg
    ports:
      - '8888:80'
      - '8081:8080'

  gotenberg:
    image: gotenberg/gotenberg:8
    networks:
      - docking-network
    ports:
      - '9898:3000'

networks:
  docking-network:
    driver: bridge

volumes:
  app_storage:
