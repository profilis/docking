version: '3.9'

services:
  docking:
    build:
      context: .
      dockerfile: .docker/octane.Dockerfile
    volumes:
      - app_storage:/var/www/html/storage/app
    links:
      - gotenberg
    ports:
      - '8888:80'
      - '8081:8080'

  gotenberg:
    image: gotenberg/gotenberg:8
    ports:
      - '9898:3000'

volumes:
  app_storage:
